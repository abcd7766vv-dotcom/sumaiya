<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APK বিল্ডার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEFF1; --panel:#FFFFFF; --ink:#10202A; --mute:#5A6A74; --line:#CBD5DA;
  --accent:#E8590C; --accent-ink:#FFFFFF; --ok:#12723A; --bad:#B3261E; --code:#0F1B22; --code-ink:#DCE8EE;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0C1418; --panel:#141F26; --ink:#E8EEF1; --mute:#93A5AE; --line:#26363E;
    --accent:#FF8A3D; --accent-ink:#0C1418; --ok:#5FD08A; --bad:#FF8A80; --code:#070C0F; --code-ink:#CFE0E8;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:24px 18px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:2.4rem;line-height:1.05;margin:8px 0 6px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:1.05rem;margin:0 0 4px;font-weight:600}
.card p{margin:0 0 10px;color:var(--mute);font-size:.95rem}
input[type=password],input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}
input[type=file]{width:100%;font:inherit;color:var(--mute)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button,.big{font:inherit;cursor:pointer}
.btn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 18px;min-height:44px;font-weight:600}
.go{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:18px;font-size:1.3rem;font-weight:700;min-height:60px}
.go:disabled{opacity:.55}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#out{display:none}
#headline{font-size:1.2rem;font-weight:600;margin:0 0 6px}
#elapsed{color:var(--mute);font-variant-numeric:tabular-nums;margin-bottom:8px}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px}
ol.steps li:last-child{border:0}
.log{margin:10px 0 0;padding:0;list-style:none;color:var(--mute);font-size:.95rem}
.log li{padding:2px 0}
.log li.bad{color:var(--bad)}
.log li.ok{color:var(--ok)}
.big{display:block;text-align:center;text-decoration:none;background:var(--ok);color:#fff;border-radius:14px;padding:20px;font-size:1.4rem;font-weight:700}
@media (prefers-color-scheme: dark){.big{color:#06120B}}
textarea#errbox{width:100%;min-height:220px;background:var(--code);color:var(--code-ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
.note{font-size:.9rem;color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>APK বিল্ডার</h1>
  <p class="sub">এক বাটনে অ্যাপের APK বানিয়ে ডাউনলোড লিংক দেবে।</p>

  <div class="card">
    <h2>১. GitHub টোকেন</h2>
    <p>প্রথমবার শুধু। নিচের বাটনে চেপে খোলা পেজে একদম নিচে গিয়ে <b>Generate token</b> চাপুন, তারপর টোকেনটা কপি করে এখানে বসান। (দুটো অনুমতি আগে থেকেই টিক দেওয়া থাকবে।)</p>
    <div class="row">
      <button class="btn" id="mkTok" type="button">টোকেন বানান (GitHub খুলবে)</button>
      <button class="btn" id="clrTok" type="button">টোকেন মুছুন</button>
    </div>
    <input id="tok" type="password" autocomplete="off" placeholder="ghp_…">
    <p class="note" style="margin-top:8px">টোকেন শুধু এই ব্রাউজারে থাকে। কাউকে বা কোনো চ্যাটে পাঠাবেন না। কাজ শেষে GitHub থেকে মুছে দিন।</p>
  </div>

  <div class="card">
    <h2>২. রিপোজিটরির নাম</h2>
    <p>যে নামে রিপো বানিয়েছেন সেটা লিখুন। না থাকলে নতুন বানিয়ে নেবে।</p>
    <input id="repo" type="text" value="sumaiya" autocapitalize="none" autocomplete="off">
  </div>

  <div class="card">
    <h2>৩. build.yml ফাইল (ঐচ্ছিক)</h2>
    <p>কিছু না দিলে ভেতরে থাকা সুমাইয়া রানী অ্যাপের ফাইলটাই ব্যবহার হবে। নিজের ফাইল দিতে চাইলে বেছে নিন।</p>
    <input id="file" type="file" accept=".yml,.yaml,text/*">
  </div>

  <button class="go" id="go" type="button">APK বানাও</button>

  <section class="card" id="out" style="margin-top:14px" aria-live="polite">
    <p id="headline"></p>
    <div id="elapsed"></div>
    <ol class="steps" id="steps"></ol>
    <ul class="log" id="log"></ul>
    <div id="result" style="margin-top:14px"></div>
  </section>
</main>

<script>
(function(){
"use strict";
const WF_B64="";
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
let TOKEN="";
let running=false;

$("#tok").value=store.get("ab_tok","");
$("#repo").value=store.get("ab_repo","sumaiya");

function cleanToken(s){
  s=String(s||"");
  const m=s.match(/(github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9]+)/);
  return m?m[0]:s.replace(/[^\x21-\x7E]/g,"");
}
function b64utf8(str){
  const bytes=new TextEncoder().encode(str);
  let bin="";
  for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
async function gh(method,path,body){
  const res=await fetch("https://api.github.com"+path,{
    method:method,
    headers:Object.assign({
      "Authorization":"Bearer "+TOKEN,
      "Accept":"application/vnd.github+json",
      "X-GitHub-Api-Version":"2022-11-28"
    },body?{"Content-Type":"application/json"}:{}),
    body:body?JSON.stringify(body):undefined
  });
  const txt=await res.text();
  let data=null;
  try{data=txt?JSON.parse(txt):null}catch(e){data=txt}
  return {ok:res.ok,status:res.status,data:data,scopes:res.headers.get("x-oauth-scopes")};
}
function apiErr(r,prefix){
  const m=(r.data&&r.data.message)?r.data.message:("কোড "+r.status);
  let hint="";
  if(r.status===401)hint=" — টোকেন ভুল বা মেয়াদ শেষ। নতুন টোকেন বানান।";
  if(r.status===403||r.status===404)hint=hint||" — টোকেনে repo ও workflow অনুমতি আছে কি দেখুন।";
  return new Error(prefix+": "+m+hint);
}

/* ---------- UI helpers ---------- */
function say(msg,cls){
  const li=document.createElement("li");
  if(cls)li.className=cls;
  li.textContent=msg;
  $("#log").appendChild(li);
}
function headline(t){$("#headline").textContent=t}
function renderSteps(jobs){
  const ol=$("#steps");ol.innerHTML="";
  if(!jobs.length)return;
  jobs[0].steps.forEach(s=>{
    const li=document.createElement("li");
    let ic="◻";
    if(s.status==="in_progress")ic="⏳";
    else if(s.status==="completed")ic=s.conclusion==="success"||s.conclusion==="skipped"?"✅":"❌";
    li.textContent=ic+" "+s.name;
    ol.appendChild(li);
  });
}
function reset(){
  $("#out").style.display="block";
  $("#log").innerHTML="";$("#steps").innerHTML="";$("#result").innerHTML="";$("#elapsed").textContent="";
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(t).catch(()=>fallbackCopy());
  }
  return Promise.resolve(fallbackCopy());
}
function fallbackCopy(){
  const b=$("#errbox");if(!b)return;
  b.focus();b.select();
  try{document.execCommand("copy")}catch(e){}
}

/* ---------- Failure details ---------- */
function extractErrors(text){
  const lines=text.split("\n").map(l=>l.replace(/^\d{4}-\d\d-\d\dT[\d:.]+Z\s?/,"").replace(/\r$/,""));
  const re=/(^e: |error:|FAILURE|What went wrong|Execution failed|Could not|Unresolved reference|Exception|Type mismatch|Cannot |not found|Invalid workflow)/i;
  const seen=new Set();const hit=[];
  for(const l of lines){if(re.test(l)&&!seen.has(l)){seen.add(l);hit.push(l);if(hit.length>=40)break}}
  const out=hit.length?hit:lines.slice(-30);
  return out.join("\n").slice(0,4500);
}
async function annotationsFor(login,repo,checkRunId){
  const r=await gh("GET","/repos/"+login+"/"+repo+"/check-runs/"+checkRunId+"/annotations");
  if(!r.ok||!Array.isArray(r.data))return "";
  return r.data.map(a=>(a.title?a.title+": ":"")+(a.message||"")).join("\n");
}
async function showFailure(login,repo,run,jobs){
  headline("❌ বিল্ড ব্যর্থ হয়েছে");
  const info=["Run: "+run.html_url];
  const failed=jobs.filter(j=>j.conclusion==="failure");
  for(const j of failed){
    const st=j.steps.filter(s=>s.conclusion==="failure").map(s=>s.name);
    info.push("ব্যর্থ ধাপ: "+(st.join(", ")||"অজানা"));
    let logText=null;
    try{
      const lr=await fetch("https://api.github.com/repos/"+login+"/"+repo+"/actions/jobs/"+j.id+"/logs",
        {headers:{"Authorization":"Bearer "+TOKEN,"Accept":"application/vnd.github+json"}});
      if(lr.ok)logText=await lr.text();
    }catch(e){}
    if(logText)info.push(extractErrors(logText));
    else{
      const an=await annotationsFor(login,repo,j.id);
      if(an)info.push(an);
    }
  }
  if(!jobs.length){
    info.push("কোনো জব চলেনি — workflow ফাইলেই সমস্যা থাকতে পারে।");
    try{
      const cs=await gh("GET","/repos/"+login+"/"+repo+"/check-suites/"+run.check_suite_id+"/check-runs");
      if(cs.ok&&cs.data.check_runs){
        for(const c of cs.data.check_runs){
          const an=await annotationsFor(login,repo,c.id);
          if(an)info.push(an);
        }
      }
    }catch(e){}
  }
  const box=document.createElement("textarea");
  box.id="errbox";box.readOnly=true;box.value=info.join("\n\n");
  const btn=document.createElement("button");
  btn.className="btn";btn.type="button";btn.style.margin="10px 0";btn.textContent="এরর কপি করুন";
  btn.addEventListener("click",()=>{copyText(box.value).then(()=>{btn.textContent="কপি হয়েছে ✔"})});
  const p=document.createElement("p");
  p.className="note";p.textContent="নিচের লেখাটা কপি করে Claude-কে পাঠান। আমি ঠিক করে নতুন ফাইল দেব।";
  $("#result").append(p,btn,box);
}
function showApk(url,relUrl,size){
  headline("✅ APK তৈরি হয়েছে!");
  const a=document.createElement("a");
  a.className="big";a.href=url;a.textContent="📥 APK ডাউনলোড করুন";
  a.rel="noopener";
  const p=document.createElement("p");
  p.className="note";p.style.marginTop="10px";
  p.textContent="ডাউনলোড শেষে ফোনের Files/Downloads থেকে APK-তে ট্যাপ করে ইনস্টল করুন। 'অজানা উৎস থেকে ইনস্টল' জিজ্ঞেস করলে অনুমতি দিন। আকার: "+(size/1048576).toFixed(1)+" MB";
  const l=document.createElement("a");
  l.href=relUrl;l.textContent="Releases পেজ";l.style.color="var(--accent)";
  $("#result").append(a,p,l);
}

/* ---------- Main flow ---------- */
async function build(){
  if(running)return;
  running=true;$("#go").disabled=true;reset();
  let timer=null;
  try{
    TOKEN=cleanToken($("#tok").value);
    if(!TOKEN)throw new Error("আগে GitHub টোকেন দিন (ধাপ ১)।");
    const repo=($("#repo").value||"sumaiya").trim().replace(/[^A-Za-z0-9._-]/g,"");
    if(!repo)throw new Error("রিপোজিটরির নাম লিখুন।");
    store.set("ab_tok",TOKEN);store.set("ab_repo",repo);

    headline("GitHub-এ ঢুকছি…");
    let r=await gh("GET","/user");
    if(!r.ok)throw apiErr(r,"টোকেন কাজ করছে না");
    const login=r.data.login;
    say("অ্যাকাউন্ট: "+login,"ok");
    if(r.scopes!==null&&r.scopes!==undefined){
      const sc=r.scopes.split(",").map(x=>x.trim());
      if(!sc.includes("workflow")||!sc.includes("repo"))
        throw new Error("টোকেনে 'repo' ও 'workflow' দুটো অনুমতিই লাগবে। ধাপ ১-এর বাটন থেকে নতুন টোকেন বানান।");
    }

    r=await gh("GET","/repos/"+login+"/"+repo);
    if(r.status===404){
      say("রিপোজিটরি বানাচ্ছি…");
      r=await gh("POST","/user/repos",{name:repo,private:false,auto_init:true,description:"Android app build"});
      if(!r.ok)throw apiErr(r,"রিপোজিটরি বানানো যায়নি");
      await sleep(3000);
    }else if(!r.ok){
      throw apiErr(r,"রিপোজিটরি দেখা যায়নি");
    }
    const branch=r.data.default_branch||"main";
    say("রিপোজিটরি: "+login+"/"+repo,"ok");

    let content=WF_B64;
    const f=$("#file").files&&$("#file").files[0];
    if(f){content=b64utf8(await f.text());say("আপনার দেওয়া ফাইল ব্যবহার করছি: "+f.name)}

    let target=".github/workflows/build.yml";
    const dir=await gh("GET","/repos/"+login+"/"+repo+"/contents/.github/workflows?ref="+branch);
    if(dir.ok&&Array.isArray(dir.data)){
      const ys=dir.data.filter(x=>/\.ya?ml$/i.test(x.name));
      if(ys.length===1)target=ys[0].path;
    }
    const cur=await gh("GET","/repos/"+login+"/"+repo+"/contents/"+target+"?ref="+branch);
    const sha=cur.ok?cur.data.sha:undefined;
    const same=cur.ok&&String(cur.data.content||"").replace(/\s/g,"")===content;

    let maxId=0;
    const r0=await gh("GET","/repos/"+login+"/"+repo+"/actions/runs?per_page=5");
    if(r0.ok&&r0.data.workflow_runs)r0.data.workflow_runs.forEach(x=>{maxId=Math.max(maxId,x.id)});

    if(!same){
      const body={message:"Add Android app build workflow",content:content,branch:branch};
      if(sha)body.sha=sha;
      const put=await gh("PUT","/repos/"+login+"/"+repo+"/contents/"+target,body);
      if(!put.ok)throw apiErr(put,"build ফাইল বসানো যায়নি");
      say("build ফাইল বসানো হয়েছে।","ok");
    }else{
      say("ফাইল আগেই ঠিক আছে, নতুন করে বিল্ড চালাচ্ছি…");
      const wf=target.split("/").pop();
      let done=false;
      for(let i=0;i<8&&!done;i++){
        const d=await gh("POST","/repos/"+login+"/"+repo+"/actions/workflows/"+wf+"/dispatches",{ref:branch});
        if(d.ok)done=true;else await sleep(4000);
      }
      if(!done)throw new Error("বিল্ড চালু করা যায়নি।");
    }

    headline("বিল্ড শুরুর অপেক্ষা…");
    let run=null;
    for(let i=0;i<40&&!run;i++){
      await sleep(4000);
      const rr=await gh("GET","/repos/"+login+"/"+repo+"/actions/runs?per_page=10");
      if(rr.ok&&rr.data.workflow_runs){
        run=rr.data.workflow_runs.filter(x=>x.id>maxId&&String(x.path||"").indexOf(target)===0)
          .sort((a,b)=>b.id-a.id)[0]||null;
      }
    }
    if(!run)throw new Error("বিল্ড শুরু হয়নি। GitHub-এর Actions ট্যাবে দেখুন।");

    const t0=Date.now();
    timer=setInterval(()=>{
      const s=Math.floor((Date.now()-t0)/1000);
      $("#elapsed").textContent="সময়: "+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")+" (৫–১০ মিনিট লাগে, পেজ খোলা রাখুন)";
    },1000);

    let jobs=[];
    for(;;){
      const cr=await gh("GET","/repos/"+login+"/"+repo+"/actions/runs/"+run.id);
      if(cr.ok)run=cr.data;
      const jr=await gh("GET","/repos/"+login+"/"+repo+"/actions/runs/"+run.id+"/jobs");
      if(jr.ok&&jr.data.jobs){jobs=jr.data.jobs;renderSteps(jobs)}
      headline(run.status==="completed"?"শেষ হয়েছে":"বিল্ড চলছে…");
      if(run.status==="completed")break;
      if(Date.now()-t0>40*60*1000)throw new Error("অনেক সময় লাগছে। GitHub-এর Actions ট্যাবে দেখুন।");
      await sleep(6000);
    }
    clearInterval(timer);timer=null;

    if(run.conclusion==="success"){
      const rel=await gh("GET","/repos/"+login+"/"+repo+"/releases?per_page=5");
      let asset=null,relUrl="";
      if(rel.ok&&Array.isArray(rel.data)){
        const tag="build-"+run.run_number;
        const rl=rel.data.find(x=>x.tag_name===tag)||rel.data[0];
        if(rl){relUrl=rl.html_url;asset=(rl.assets||[]).find(a=>/\.apk$/i.test(a.name))}
      }
      if(!asset)throw new Error("বিল্ড সফল, কিন্তু APK খুঁজে পাইনি। রিপোর Releases পেজ দেখুন।");
      showApk(asset.browser_download_url,relUrl,asset.size);
    }else{
      await showFailure(login,repo,run,jobs);
    }
  }catch(e){
    if(timer)clearInterval(timer);
    headline("❌ সমস্যা");
    say(e&&e.message?e.message:String(e),"bad");
  }finally{
    running=false;$("#go").disabled=false;
  }
}

$("#go").addEventListener("click",build);
$("#mkTok").addEventListener("click",()=>{
  window.open("https://github.com/settings/tokens/new?scopes=repo,workflow&description=APK+Builder","_blank");
});
$("#clrTok").addEventListener("click",()=>{store.del("ab_tok");$("#tok").value=""});
})();
</script>
</body>
</html>
