              }

              private fun clearMarks() {
                  val v = marksView ?: return
                  try {
                      wm?.removeView(v)
                  } catch (e: Exception) {
                  }
                  marksView = null
              }

              // ---------- Voice output (female, cute) ----------
              override fun onInit(status: Int) {
                  val t = tts ?: return
                  if (status != TextToSpeech.SUCCESS) return
                  val r = t.setLanguage(Locale("bn", "BD"))
                  if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                      t.setLanguage(Locale("bn", "IN"))
                  }
                  try {
                      val all = t.voices
                      if (all != null) {
                          val bn = all.filter { it.locale.language == "bn" }
                          val pick = bn.firstOrNull {
                              val n = it.name.lowercase()
                              n.contains("female") || n.contains("bnf") || n.contains("-f-")
                          } ?: bn.firstOrNull()
                          if (pick != null) t.voice = pick
                      }
                  } catch (e: Exception) {
                  }
                  t.setPitch(1.3f)
                  t.setSpeechRate(1.0f)
                  speak("à¦¬à¦¸, à¦†à¦ªà¦¨à¦¾à¦° à¦œà¦¨à§à¦¯ à¦à¦–à¦¨ à¦•à§€ à¦•à¦¾à¦œ à¦•à¦°à§‡ à¦¦à§‡à¦¬? à¦­à¦¾à¦¸à¦®à¦¾à¦¨ à¦¬à¦¾à¦Ÿà¦¨ à¦šà§‡à¦ªà§‡ à¦¬à¦²à§à¦¨à¥¤")
              }

              private fun speak(text: String) {
                  val t = tts ?: return
                  val s = if (text.length > 600) text.substring(0, 600) else text
                  t.speak(s, TextToSpeech.QUEUE_FLUSH, null, "sr")
              }

              private fun toast(msg: String) {
                  Toast.makeText(this, msg, Toast.LENGTH_LONG).show()
              }

              override fun onDestroy() {
                  main.removeCallbacks(autoClear)
                  clearMarks()
                  hideBanner()
                  try {
                      bubble?.let { wm?.removeView(it) }
                  } catch (e: Exception) {
                  }
                  bubble = null
                  try {
                      recognizer?.destroy()
                  } catch (e: Exception) {
                  }
                  tts?.stop()
                  tts?.shutdown()
                  try {
                      vdisplay?.release()
                  } catch (e: Exception) {
                  }
                  try {
                      reader?.setOnImageAvailableListener(null, null)
                  } catch (e: Exception) {
                  }
                  synchronized(lock) {
                      held?.close()
                      held = null
                  }
                  try {
                      reader?.close()
                  } catch (e: Exception) {
                  }
                  try {
                      projection?.stop()
                  } catch (e: Exception) {
                  }
                  bg?.quitSafely()
                  super.onDestroy()
              }
          }
